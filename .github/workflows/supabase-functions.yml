name: Publicar Edge Function (Supabase)

# Publica a pasta supabase/functions/play/ INTEIRA (index.ts + _shared/) a partir da branch main.
# Roda só quando você clica em "Run workflow" (aba Actions): publicar a função no ar é uma decisão sua,
# não algo que deve acontecer a cada push.
#
# Antes da primeira vez: crie o segredo SUPABASE_ACCESS_TOKEN no repositório
# (Settings > Secrets and variables > Actions). O token se gera no painel do Supabase:
# avatar (canto superior direito) > Account preferences > Access Tokens > Generate new token.
# Detalhes em docs/SUPABASE.md.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Ref do projeto Supabase (o trecho antes de .supabase.co em shared/backend/config.js)"
        required: true
        default: "vizpjhrkuztzgqiqjwom"

permissions:
  contents: read

jobs:
  deploy-play:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredo e arquivos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)."; exit 1
          fi
          # Os jogos de duelo por turnos precisam estar na main antes de publicar: sem o domínio e o
          # roteamento `<jogo>_`, as ações caem na checagem de jogo solo e voltam `unknown_game`.
          for game in chess dama; do
            test -f "supabase/functions/play/_shared/$game/domain.js" || { echo "::error::A branch main não tem supabase/functions/play/_shared/$game/domain.js"; exit 1; }
            grep -q "startsWith(\"${game}_\")" supabase/functions/play/index.ts || { echo "::error::O index.ts da main não roteia as ações do jogo '$game' (falta startsWith(\"${game}_\"))."; exit 1; }
            grep -q "\"${game}_move\"" supabase/functions/play/index.ts || { echo "::error::O index.ts da main não tem a ação ${game}_move."; exit 1; }
          done
          echo "Arquivos conferidos:"; find supabase/functions/play -type f | sort

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar a função play
        # --yes: o CLI novo pede confirmação e, no Actions, não há terminal para responder.
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
        run: supabase functions deploy play --project-ref "$PROJECT_REF" --yes
