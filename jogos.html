<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebMiniGames · Jogos</title>
<script src="shared/theme-init.js"></script>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/userbar.css">
<link rel="stylesheet" href="css/ranking-list.css">
<link rel="stylesheet" href="css/coins.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="12" fill="#14213d"/>
    <rect x="27" y="27" width="13" height="13" rx="4" fill="#f2b134"/>
    <path d="M10 12H32V24H10V36H24" fill="none" stroke="#2cc4b6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="12" r="3.4" fill="#fff"/>
  </symbol>
</svg>

<!-- ===== Entrada ===== -->
<!-- ===== Hub ===== -->
<section id="view-hub">
  <div class="topbar">
    <div class="brand"><svg class="logo" width="36" height="36" aria-hidden="true"><use href="#logo"/></svg>WebMiniGames</div>
    <div id="userbar"></div>
  </div>
  <div class="hub">
    <div class="hub-main">
    <h2 id="hub-title" tabindex="-1">Escolha um jogo</h2>
    <p class="sub" id="hubSub"></p>
    <div class="games" id="games"></div>
    </div>
    <aside class="overall" aria-labelledby="overall-title">
      <h2 id="overall-title">Ranking geral</h2>
      <p class="sub">Soma da pontuação de todos os jogos.</p>
      <div class="ranking-scopes" id="overallScopes"></div>
      <ol class="ranking-list" id="overallList"></ol>
      <p class="ranking-note" id="overallNote"></p>
    </aside>
  </div>
</section>

<!-- ===== Jogo ===== -->
<script src="shared/file-warning.js"></script>
<script type="module" src="js/hub.js"></script>
</body>
</html>
