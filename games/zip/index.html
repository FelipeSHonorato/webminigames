<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zip</title>
<script src="../../shared/theme-init.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../css/gamebar.css">
<link rel="stylesheet" href="../../css/ranking-list.css">
<link rel="stylesheet" href="../../css/ranking.css">
<link rel="stylesheet" href="../../css/userbar.css">
<link rel="stylesheet" href="../../css/coins.css">
</head>
<body>
<nav class="sitebar"><a href="../../jogos.html">← Jogos</a><div class="gametitle"><strong>Zip</strong><span id="coinBadge"></span></div><div id="userbar"></div></nav>
<main>
  <header><h1>Zip</h1><span id="timer">00:00</span></header>
  <div id="level"><b id="levelName"></b><div class="bar"><i id="barFill"></i></div><span id="levelCount"></span></div>
  <svg id="board" viewBox="0 0 600 600" tabindex="0" role="application" aria-label="Tabuleiro do Zip"></svg>
  <div id="msg" role="status"></div>
  <div class="actions">
    <button id="undo">Desfazer</button>
    <button id="reset">Reiniciar</button>
    <button id="next">Nova fase</button>
  </div>
  <p class="help">Arraste do 1 até o último número, passando pelos números em ordem e por todas as células. Paredes grossas bloqueiam o caminho. No teclado, use as setas e Backspace.</p>
</main>
<script src="../../shared/file-warning.js"></script>
<script type="module" src="./ui.js"></script>
</body>
</html>
