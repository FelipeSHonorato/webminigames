<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Preview · Entendi persistente</title>
<link rel="stylesheet" href="css/duel-invite.css">
</head>
<body>
<script type="module">
import { startDuelInvites } from "./shared/duel-invites.js";

/* O servidor devolve o MESMO evento nas duas páginas (como nos 60 s reais). */
const event = {
  id: "11111111-1111-4111-8111-111111111111", code: "ABC123", gameId: "uno", kind: "party",
  level: 0, maxSeconds: 1200, createdAt: new Date().toISOString(),
  expiresAt: new Date(Date.now() + 600000).toISOString(), maxPlayers: 4,
  opponent: { nickname: "Glifozato", avatar: null, ready: false, away: false },
  notice: { kind: "host_left", userId: "u1", nickname: "Glifozato", at: "2026-11-12T12:00:00Z" },
};
const cloud = {
  active: true, uid: "u1",
  async duelInvites() { return { invites: [event] }; },
  async partyLeave() { return { status: "waiting" }; },
  async duelDecline() { return { status: "cancelled" }; },
};
window.__invites = startDuelInvites({ base: "", cloud });
</script>
</body>
</html>
