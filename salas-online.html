<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebMiniGames · Salas Online</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/email-logo.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="assets/email-logo.png">
<script src="shared/theme-init.js"></script>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/userbar.css">
<link rel="stylesheet" href="css/ranking-list.css">
<link rel="stylesheet" href="css/coins.css">
<link rel="stylesheet" href="css/hub-nav.css">
<link rel="stylesheet" href="css/salas.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="12" fill="#14213d"/>
    <rect x="27" y="27" width="13" height="13" rx="4" fill="#f2b134"/>
    <path d="M10 12H32V24H10V36H24" fill="none" stroke="#2cc4b6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="12" r="3.4" fill="#fff"/>
  </symbol>
</svg>

<section id="view-hub">
  <div class="topbar">
    <a class="brand" href="jogos.html" aria-label="WebMiniGames: voltar para os jogos"><svg class="logo" width="36" height="36" aria-hidden="true"><use href="#logo"/></svg>WebMiniGames</a>
    <div id="userbar"></div>
  </div>
  <div class="hub">
    <!-- Filtro: "Todos" + um item por jogo de duelo (montado por js/salas.js a partir do catálogo). -->
    <nav class="hub-nav" id="roomsNav" aria-label="Filtrar salas por jogo"></nav>
    <div class="hub-main">
      <h2 id="rooms-title" tabindex="-1">Salas online</h2>
      <p class="sub" id="roomsSub" aria-live="polite"></p>
      <div class="rooms-bar">
        <span class="rooms-status" id="roomsStatus" role="status"></span>
        <button class="rooms-refresh" id="roomsRefresh" type="button">Atualizar</button>
      </div>
      <p class="rooms-notice" id="roomsNotice" role="status" hidden></p>
      <ul class="rooms" id="rooms" aria-busy="true"></ul>
      <p class="hub-empty" id="roomsEmpty" hidden></p>
    </div>
    <!-- Mesmo ranking do modo Duelos 1×1 do hub. -->
    <aside class="overall" aria-labelledby="overall-title">
      <h2 id="overall-title">Ranking Geral - Duelos 1×1</h2>
      <p class="sub" id="overallSub"></p>
      <div class="ranking-scopes" id="overallScopes"></div>
      <ol class="ranking-list" id="overallList"></ol>
      <p class="ranking-note" id="overallNote"></p>
      <div class="overall-dots" id="overallDots" hidden></div>
    </aside>
  </div>
</section>

<script src="shared/file-warning.js"></script>
<script type="module" src="js/salas.js"></script>
</body>
</html>
